<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><style>body{font:14px -apple-system,sans-serif;color:#222;line-height:1.6;margin:24px}h1{font-size:23px}h2{font-size:16px;margin-bottom:4px}</style><body><h1>安裝前須知</h1><h2>系統需求</h2><p>Apple Silicon Mac；macOS @MIN_OS@ 或更新版本。</p><h2>安裝位置</h2><p>XAMP2 @VERSION@ 將安裝至 /Applications/XAMP2.app。安裝時，macOS 可能要求管理者授權。</p><h2>更新現有版本</h2><p>請先結束正在執行的 XAMP2。安裝會更新「應用程式」中的同名程式，不會刪除使用者資料夾中的播放清單與設定。</p><h2>外接音效裝置</h2><p>一般播放可使用 Mac 內建輸出；DoP 播放需要支援對應格式與取樣率的 DAC，並在 XAMP2 選擇獨佔輸出。</p></body></html>
